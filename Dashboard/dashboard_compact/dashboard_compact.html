<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GNSS Intrusion Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard_compact.css" />
</head>
<body>
  <main class="dashboard-shell">
    <section class="summary-column">
      <article class="card status-card">
        <div class="card-header">
          <h2>System Status</h2>
          <span class="status-pill" id="systemStatus">NORMAL</span>
        </div>

        <div class="status-meta">
          <div class="meta-row">
            <span class="meta-label">Threat flags</span>
            <div class="threat-indicators">
              <span class="threat-pill" id="spoofingIndicator">Spoofing</span>
              <span class="threat-pill" id="jammingIndicator">Jamming</span>
              <span class="threat-pill" id="neitherIndicator">Neither</span>
              <span class="threat-pill" id="bothIndicator">Both</span>
            </div>
          </div>
          <div class="meta-row">
            <span class="meta-label">First detected</span>
            <span class="meta-value" id="firstDetected">--:--:-- -- (-- ago)</span>
          </div>
        </div>
      </article>

      <article class="card overview-card">
        <div class="card-header stacked">
          <h2>Model Overview</h2>
          <span class="confidence-value" id="confidenceScore">0%</span>
        </div>

        <div class="overview-copy">Overall attack confidence across the active detection pipeline.</div>

        <div class="progress-wrap" aria-label="Confidence score bar">
          <div class="progress-fill" id="confidenceBar"></div>
        </div>
      </article>
    </section>

    <section class="card chart-card">
      <div class="card-header chart-header">
        <div>
          <h2>Attack Scores by Type</h2>
          <p class="chart-caption">Recent window • normalized score from 0 to 1</p>
        </div>
      </div>
      <div class="chart-area">
        <canvas id="attackScoreChart"></canvas>
      </div>
    </section>
  </main>

  <script src="dashboard_compact.js"></script>
</body>
</html>
